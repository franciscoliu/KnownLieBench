[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knownliebench"
version = "1.0.0"
description = "KnownLieBench: a knowledge-verified benchmark of emergent deception in LLM agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0,<7",
  "openai>=1.40,<3",
]

[project.optional-dependencies]
local = [
  "torch>=2.1",
  "transformers>=4.56",
  "accelerate>=0.30",
]
dev = ["pytest>=8.0,<9"]

[project.urls]
Repository = "https://github.com/franciscoliu/KnownLieBench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knownliebench" = ["envs/*/data/*.json", "envs/*/data/scenarios/*/*.json"]
